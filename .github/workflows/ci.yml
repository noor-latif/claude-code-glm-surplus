name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs are in sync
        run: python3 tools/sync.py --check
      - name: Bash syntax
        run: for f in install.sh scripts/*.sh; do bash -n "$f"; done
      - name: PowerShell syntax
        shell: pwsh
        run: |
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$null) | Out-Null
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$null) | Out-Null
          }

  surplus-live:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      SURPLUS_API_KEY: ${{ secrets.SURPLUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run live Surplus smoke tests
        run: |
          if [ -z "$SURPLUS_API_KEY" ]; then
            echo "SURPLUS_API_KEY secret is not configured; skipping live tests"
            exit 0
          fi
          python3 tests/surplus_smoke.py

  install-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install and uninstall
        env:
          SURPLUS_API_KEY: dummy-key-for-ci
        run: |
          set -eu
          ./install.sh --no-mcp
          grep -q "https://api.surplusintelligence.ai/v1" ~/.claudez/claudez.sh
          grep -q "glm-5.3" ~/.claudez/claudez.sh
          grep -q "qwen3.8-omni-flash" ~/.claudez/claudez.sh
          test -f ~/.config/surplus/api_key
          ./install.sh --uninstall --purge
          test ! -f ~/.config/surplus/api_key

  install-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and uninstall
        env:
          SURPLUS_API_KEY: dummy-key-for-ci
        run: |
          .\install.ps1 -NoMcp
          Select-String -Path "$HOME\.claudez\claudez.ps1" -SimpleMatch "https://api.surplusintelligence.ai/v1"
          Select-String -Path "$HOME\.claudez\claudez.ps1" -SimpleMatch "glm-5.3"
          Select-String -Path "$HOME\.claudez\claudez.ps1" -SimpleMatch "qwen3.8-omni-flash"
          .\install.ps1 -Uninstall -Purge
